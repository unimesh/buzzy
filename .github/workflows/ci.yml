name: CI

on:
  push:
    branches: [mainline]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Single source of truth: fmt --check + clippy -D warnings + tests
      # (including the architecture-boundary test).
      - run: cargo xtask ci
